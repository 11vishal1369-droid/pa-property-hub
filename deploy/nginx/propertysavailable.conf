# propertysavailable.com / www  -> main website (+ /webcontent editor), /api, /webcontent-api
# admin.propertysavailable.com  -> admin panel (served under /admin/), /api
# All three names share one certificate and one VPS (201.18.206.131).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name propertysavailable.com www.propertysavailable.com admin.propertysavailable.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.propertysavailable.com;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 301 https://propertysavailable.com$request_uri;
}

# Main website
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name propertysavailable.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/conf.d/common.inc;

    # The admin panel lives on its own subdomain.
    location /admin { return 301 https://admin.propertysavailable.com$request_uri; }

    location /webcontent-api/ {
        proxy_pass http://webcontent:8002;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}

# Admin panel
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.propertysavailable.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    include /etc/nginx/conf.d/common.inc;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /admin/; }
    location = /admin { return 301 /admin/; }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /webcontent-api/ {
        proxy_pass http://webcontent:8002;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Anything else on the admin host (except shared assets) goes to the panel.
    location / {
        root /usr/share/nginx/html;
        try_files $uri @to_admin;
    }
    location @to_admin { return 302 /admin/; }
}
