# PA Super Admin: propertysavailable.com
#   /admin/ -> admin panel (static React build in this container)
#   /api/   -> admin FastAPI backend (compose service "backend")
# WARNING: the mobile app is also said to use propertysavailable.com/api. Only one service can own /api; see README.

server {
    listen 80;
    listen [::]:80;
    server_name propertysavailable.com www.propertysavailable.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://propertysavailable.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name propertysavailable.com www.propertysavailable.com;

    ssl_certificate     /etc/letsencrypt/live/propertysavailable.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/propertysavailable.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /admin { return 301 /admin/; }

    location /admin/static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Main website: not part of this package. Point this at the existing site if it runs on this VPS.
    location / { return 404; }
}
