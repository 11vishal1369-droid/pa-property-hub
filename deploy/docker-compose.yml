name: propertysavailable

# From /opt/propertysavailable/deploy:  docker compose up -d --build
# Starts MongoDB (internal only), the backend API, the website content service, the main website and the admin panel.
# aaPanel's Nginx on the host does HTTPS and proxies to the ports below (see README.md).
# Ports bind to 127.0.0.1 by default so only the host's Nginx can reach them; set BIND_IP=0.0.0.0 in .env to open them.

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-pa-backend:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:5000:8001"

  webcontent:
    image: ${WEBCONTENT_IMAGE:-pa-webcontent:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: webcontent
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BIND_IP:-127.0.0.1}:5001:8002"

  website:
    image: ${FRONTEND_IMAGE:-pa-frontend:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
      args:
        REACT_APP_BACKEND_URL: ${ADMIN_BASE_URL:-https://admin.propertysavailable.com}
    restart: unless-stopped
    command: ["serve", "--no-clipboard", "--config", "/srv/website.json", "-l", "tcp://0.0.0.0:3000"]
    ports:
      - "${BIND_IP:-127.0.0.1}:3000:3000"

  admin:
    image: ${FRONTEND_IMAGE:-pa-frontend:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: frontend
      args:
        REACT_APP_BACKEND_URL: ${ADMIN_BASE_URL:-https://admin.propertysavailable.com}
    restart: unless-stopped
    command: ["serve", "--no-clipboard", "--config", "/srv/admin.json", "-l", "tcp://0.0.0.0:3001"]
    ports:
      - "${BIND_IP:-127.0.0.1}:3001:3001"

volumes:
  mongo-data:
